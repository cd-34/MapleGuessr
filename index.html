<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" href="favicon.png" type="image/svg+xml">
    <title>MapleGuessr</title>
</head>
<body>
    <h1>MapleGuessr</h1>
    <div id="game-container">
        <div id="hint">
            <h2>Hint</h2>
            <img id="hint-image" src="" alt="Hint">
            <button id="help-button" type="button" disabled>How to play</button>
        </div>
        <div id="map"></div>
        <div id="guesses">
            <h2>Guesses</h2>
            <div id="guess-stack">
                
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="back-button" type="button" disabled>Back</button>
        <button id="confirm-button" disabled>Confirm</button>
        <button id="give-up-button" type="button">Give Up</button>
    </div>

    <dialog class="dialog">
        <div class="dialog-header">
            Give up?
        </div>
        <div class="dialog-body">
            How To Play MapleGuessr
        </div>
    </dialog>
    <script>
        // shows dialog permanently for debugging purposes
        // document.querySelector('.dialog').showModal()
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
    <link rel="icon" href="favicon.png" type="image/svg+xml">
    <title>MapleGuessr</title>
</head>
<body>
    <h1>MapleGuessr</h1>
    <div id="game-container">
        <div id="hint">
            <h2>Hint</h2>
            <img id="hint-image" src="" alt="Hint">
            <button id="help-button" type="button" disabled>How to play</button>
        </div>
        <div id="map"></div>
        <div id="guesses">
            <h2>Guesses</h2>
            <div id="guess-stack">
                <!-- filled by renderGuesses -->
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="back-button" type="button" disabled>Back</button>
        <button id="confirm-button" disabled>Confirm</button>
        <button id="give-up-button" type="button">Give Up</button>
    </div>
    <div id="stats-controls">
        <button id="share-button">Stats</button>
        <div class="copy-popup-wrapper">
            <span class="popuptext" id="copy-popup">Copied!</span>
        </div>
    </div>

    <div id="giveup-overlay">
        <div id="giveup-modal">
            <h2 id="giveup-heading">Are you sure you want to give up?</h2>
            <img id="giveup-image" src="hit.webp" alt="">
            <div id="giveup-buttons">
                <button id="giveup-no-button">No</button>
                <button id="giveup-yes-button">Yes</button>
            </div>
        </div>
    </div>

    <div id="endgame-overlay">
        <div id="endgame-modal">
            <!-- will be populated different depending on win vs loss -->
            <h2 id="endgame-heading"></h2> 
            <h3 id="endgame-node-heading"></h3>
            <a id="endgame-node-link" href="#" target="_blank" rel="noopener">View on NiaMeowDB</a>

            <img id="endgame-hint-image" src="" alt="Hint enlarged">
            <div id="endgame-chart"></div>
            
            <div class="copy-popup-wrapper">
                <button id="endgame-share-button">Share</button>
                <span class="popuptext" id="copy-popup">Copied to clipboard!</span>
            </div>
            <button id="endgame-close-button">Close</button>
            </div>
    </div>
</body>
</html>
